<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen Fisika SMA - Interaktif</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
        
        /* Form Identitas */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
        
        /* Navigasi & Progress */
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: var(--primary-dark); }
        .progress-container { width: 100%; background-color: #e2e8f0; border-radius: 999px; height: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        
        /* Soal & Pilihan */
        .question-box { margin-bottom: 20px; }
        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { text-align: left; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 16px; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f9ff; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { border-color: var(--success); background: #dcfce7; color: #14532d; font-weight: bold; }
        .option-btn.wrong { border-color: var(--danger); background: #fee2e2; color: #7f1d1d; }
        
        /* Penjelasan */
        .explanation { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-size: 15px; }
        .explanation.show { display: block; }
        .explanation.correct-exp { background: #f0fdf4; border-left: 4px solid var(--success); }
        .explanation.wrong-exp { background: #fef2f2; border-left: 4px solid var(--danger); }
        
        /* Tombol */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Layar Hasil */
        .hidden { display: none; }
        .score-card { text-align: center; padding: 30px; background: #f8fafc; border-radius: 12px; border: 2px dashed #cbd5e1; margin: 20px 0; }
        .score-number { font-size: 48px; font-weight: 800; color: var(--primary); }
        .status-msg { margin-top: 15px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- HALAMAN 1: IDENTITAS SISWA -->
    <div id="start-screen">
        <h1>Asesmen Diagnostik & Sumatif Fisika SMA</h1>
        <p class="subtitle">30 Soal Pilihan Ganda • Umpan Balik Langsung & Pembahasan</p>
        
        <div class="form-group">
            <label for="student-name">Nama Lengkap Siswa:</label>
            <input type="text" id="student-name" placeholder="Contoh: Budi Santoso" required>
        </div>
        <div class="form-group">
            <label for="student-class">Kelas:</label>
            <select id="student-class">
                <option value="X MIPA">Kelas X (Fase E)</option>
                <option value="XI MIPA">Kelas XI (Fase F)</option>
                <option value="XII MIPA">Kelas XII (Fase F Lanjut)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="student-absen">Nomor Absen / NIS:</label>
            <input type="text" id="student-absen" placeholder="Contoh: 12" required>
        </div>
        <button class="btn" onclick="startQuiz()">Mulai Mengerjakan Asesmen</button>
    </div>

    <!-- HALAMAN 2: AREA KUIS INTERAKTIF -->
    <div id="quiz-screen" class="hidden">
        <div class="header-bar">
            <span id="question-counter">Soal 1 dari 30</span>
            <span id="live-score">Skor Sementara: 0</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">Memuat soal...</div>
            <div class="options" id="options-container"></div>
            <div class="explanation" id="explanation-box"></div>
        </div>

        <button class="btn hidden" id="next-btn" onclick="nextQuestion()">Soal Berikutnya &rarr;</button>
    </div>

    <!-- HALAMAN 3: HASIL & PENGIRIMAN EMAIL -->
    <div id="result-screen" class="hidden">
        <h1>Asesmen Selesai!</h1>
        <p class="subtitle" id="result-student-info"></p>
        
        <div class="score-card">
            <div>Nilai Akhir Anda:</div>
            <div class="score-number" id="final-score">0</div>
            <div id="correct-count">Benar: 0 dari 30 soal</div>
        </div>

        <div id="email-status" class="status-msg">Mengirimkan hasil ke email guru...</div>
        <button class="btn" onclick="location.reload()" style="margin-top: 25px; background: #475569;">Ulangi Asesmen</button>
    </div>
</div>

<script>
    // =========================================================================
    // KONFIGURASI EMAIL (Ganti dengan Access Key dari Web3Forms.com)
    // =========================================================================
    const WEB3FORMS_ACCESS_KEY = "MASUKKAN_ACCESS_KEY_ANDA_DISINI";

    // =========================================================================
    // BANK 30 SOAL FISIKA SMA LENGKAP DENGAN PEMBAHASAN
    // =========================================================================
    const quizData = [
        {
            q: "1. Besaran di bawah ini yang merupakan kelompok besaran pokok dalam Sistem Internasional (SI) adalah...",
            options: ["Massa, waktu, gaya", "Panjang, kuat arus listrik, suhu", "Kecepatan, massa, suhu", "Intensitas cahaya, usaha, waktu"],
            answer: 1,
            explanation: "Besaran pokok SI terdiri dari 7 besaran: panjang, massa, waktu, suhu, kuat arus listrik, intensitas cahaya, dan jumlah zat. Gaya, kecepatan, dan usaha adalah besaran turunan."
        },
        {
            q: "2. Sebuah mobil bergerak lurus beraturan menempuh jarak 180 km dalam waktu 2 jam. Kecepatan mobil tersebut dalam satuan SI adalah...",
            options: ["25 m/s", "30 m/s", "50 m/s", "90 m/s"],
            answer: 0,
            explanation: "v = s / t = 180 km / 2 jam = 90 km/jam. Konversi ke m/s: 90 × 1000 m / 3600 s = 25 m/s."
        },
        {
            q: "3. Benda bermassa 4 kg mula-mula diam, kemudian diberi gaya konstan sebesar 12 N. Kecepatan benda setelah 5 detik adalah...",
            options: ["10 m/s", "15 m/s", "20 m/s", "60 m/s"],
            answer: 1,
            explanation: "Percepatan a = F / m = 12 / 4 = 3 m/s². Kecepatan akhir vt = v0 + a.t = 0 + (3)(5) = 15 m/s."
        },
        {
            q: "4. Sebuah bola dilempar vertikal ke atas dengan kecepatan awal 20 m/s. Jika percepatan gravitasi g = 10 m/s², tinggi maksimum yang dicapai bola adalah...",
            options: ["10 m", "20 m", "40 m", "80 m"],
            answer: 1,
            explanation: "Di titik tertinggi vt = 0. Menggunakan vt² = v0² - 2gh → 0 = 20² - 2(10)h → 20h = 400 → h = 20 m."
        },
        {
            q: "5. Dua buah vektor gaya masing-masing 6 N dan 8 N saling tegak lurus (membentuk sudut 90°). Besar resultan kedua vektor tersebut adalah...",
            options: ["2 N", "10 N", "14 N", "48 N"],
            answer: 1,
            explanation: "Karena saling tegak lurus (cos 90° = 0), maka R = √(6² + 8²) = √(36 + 64) = √100 = 10 N."
        },
        {
            q: "6. Sebuah benda bermassa 2 kg jatuh bebas dari ketinggian 15 m di atas tanah (g = 10 m/s²). Energi kinetik benda saat berada pada ketinggian 5 m dari tanah adalah...",
            options: ["100 J", "200 J", "300 J", "400 J"],
            answer: 1,
            explanation: "Hukum Kekekalan Energi Mekanik: Ek2 = Ep1 - Ep2 = m.g.(h1 - h2) = 2 × 10 × (15 - 5) = 200 Joule."
        },
        {
            q: "7. Bola bermassa 0,5 kg bergerak dengan kecepatan 4 m/s menumbuk dinding dan memantul dengan kecepatan yang sama secara berlawanan arah. Besar impuls yang dialami bola adalah...",
            options: ["0 N.s", "2 N.s", "4 N.s", "8 N.s"],
            answer: 2,
            explanation: "Impuls I = Δp = m(v2 - v1). Karena arah berlawanan, v1 = +4 m/s dan v2 = -4 m/s. Maka I = 0,5(-4 - 4) = -4 N.s (besarnya 4 N.s)."
        },
        {
            q: "8. Momen gaya (torsi) yang dihasilkan oleh gaya 20 N yang bekerja tegak lurus pada ujung batang sepanjang 0,5 m dari poros putarnya adalah...",
            options: ["5 Nm", "10 Nm", "20 Nm", "40 Nm"],
            answer: 1,
            explanation: "Torsi τ = F × r × sin(90°) = 20 N × 0,5 m × 1 = 10 Nm."
        },
        {
            q: "9. Sebuah pegas bertambah panjang 4 cm ketika ditarik dengan gaya 8 N. Jika pegas tersebut ditarik dengan gaya 12 N (dalam batas elastisitas), pertambahan panjangnya menjadi...",
            options: ["6 cm", "8 cm", "10 cm", "16 cm"],
            answer: 0,
            explanation: "Hukum Hooke: F = k.Δx → k = F1/Δx1 = 8/4 = 2 N/cm. Untuk F2 = 12 N, maka Δx2 = 12 / 2 = 6 cm."
        },
        {
            q: "10. Tekanan hidrostatis yang dialami penyelam pada kedalaman 20 meter di bawah permukaan air laut (massa jenis air = 1.000 kg/m³, g = 10 m/s²) adalah...",
            options: ["2.000 Pa", "20.000 Pa", "200.000 Pa", "2.000.000 Pa"],
            answer: 2,
            explanation: "Ph = ρ × g × h = 1.000 × 10 × 20 = 200.000 Pa (atau 200 kPa)."
        },
        {
            q: "11. Dongkrak hidrolik memiliki luas penampang kecil 10 cm² dan penampang besar 500 cm². Jika gaya tekan pada penampang kecil 40 N, gaya angkat maksimal pada penampang besar adalah...",
            options: ["200 N", "500 N", "2.000 N", "4.000 N"],
            answer: 2,
            explanation: "Hukum Pascal: F1/A1 = F2/A2 → 40/10 = F2/500 → F2 = 4 × 500 = 2.000 N."
        },
        {
            q: "12. Air mengalir dalam pipa yang memiliki dua luas penampang berbeda. Jika perbandingan diameter pipa besar dan kecil adalah 2 : 1, maka perbandingan kecepatan aliran air di pipa besar dan kecil adalah...",
            options: ["1 : 2", "1 : 4", "2 : 1", "4 : 1"],
            answer: 1,
            explanation: "Persamaan kontinuitas: A1.v1 = A2.v2. Karena A sebanding dengan d², maka v1/v2 = (d2/d1)² = (1/2)² = 1 : 4."
        },
        {
            q: "13. Suhu suatu ruangan terbaca 25 °C. Jika dinyatakan dalam skala Kelvin, suhu ruangan tersebut adalah...",
            options: ["248 K", "273 K", "298 K", "308 K"],
            answer: 2,
            explanation: "Konversi Celcius ke Kelvin: T(K) = T(°C) + 273 = 25 + 273 = 298 K."
        },
        {
            q: "14. Kalor yang diperlukan untuk menaikkan suhu 2 kg air (kalor jenis air = 4.200 J/kg°C) dari suhu 30 °C menjadi 80 °C adalah...",
            options: ["210 kJ", "420 kJ", "672 kJ", "840 kJ"],
            answer: 1,
            explanation: "Q = m × c × ΔT = 2 × 4.200 × (80 - 30) = 8.400 × 50 = 420.000 J = 420 kJ."
        },
        {
            q: "15. Perpindahan kalor yang disertai dengan perpindahan partikel-partikel zat perantaranya (seperti pada peristiwa merebus air atau terjadinya angin darat/laut) disebut...",
            options: ["Konduksi", "Konveksi", "Radiasi", "Isolasi"],
            answer: 1,
            explanation: "Konveksi adalah perpindahan kalor melalui aliran zat perantara (fluida) yang partikelnya ikut berpindah karena perbedaan massa jenis."
        },
        {
            q: "16. Gas ideal berada dalam ruang tertutup dengan volume V, tekanan P, dan suhu mutlak T. Jika volume diperkecil menjadi setengahnya pada suhu tetap (isotermal), tekanan gas menjadi...",
            options: ["0,5 P", "P", "2 P", "4 P"],
            answer: 2,
            explanation: "Hukum Boyle (suhu tetap): P1.V1 = P2.V2 → P.V = P2.(0,5V) → P2 = 2 P."
        },
        {
            q: "17. Sebuah mesin Carnot bekerja di antara reservoir suhu tinggi 600 K dan reservoir suhu rendah 300 K. Efisiensi mesin Carnot tersebut adalah...",
            options: ["25%", "50%", "75%", "100%"],
            answer: 1,
            explanation: "Efisiensi η = (1 - T2/T1) × 100% = (1 - 300/600) × 100% = (1 - 0,5) × 100% = 50%."
        },
        {
            q: "18. Suatu gelombang berjalan memiliki frekuensi 50 Hz dan panjang gelombang 4 meter. Cepat rambat gelombang tersebut adalah...",
            options: ["12,5 m/s", "54 m/s", "100 m/s", "200 m/s"],
            answer: 3,
            explanation: "Cepat rambat gelombang v = λ × f = 4 m × 50 Hz = 200 m/s."
        },
        {
            q: "19. Peristiwa berubahnya frekuensi bunyi yang diterima pendengar akibat adanya gerak relatif antara sumber bunyi dan pendengar disebut...",
            options: ["Efek Fotolistrik", "Efek Doppler", "Resonansi", "Interferensi"],
            answer: 1,
            explanation: "Efek Doppler menjelaskan perubahan frekuensi bunyi yang terdengar lebih tinggi saat sumber mendekat dan lebih rendah saat menjauh."
        },
        {
            q: "20. Benda diletakkan 30 cm di depan cermin cekung yang memiliki jarak fokus 20 cm. Jarak bayangan yang terbentuk adalah...",
            options: ["12 cm di belakang cermin", "60 cm di depan cermin", "60 cm di belakang cermin", "12 cm di depan cermin"],
            answer: 1,
            explanation: "1/f = 1/s + 1/s' → 1/20 = 1/30 + 1/s' → 1/s' = (3 - 2)/60 = 1/60 → s' = +60 cm (tanda positif berarti nyata, di depan cermin)."
        },
        {
            q: "21. Sifat bayangan yang selalu dibentuk oleh cermin cembung (seperti kaca spion kendaraan) untuk benda nyata adalah...",
            options: ["Nyata, terbalik, diperkecil", "Maya, tegak, diperbesar", "Maya, tegak, diperkecil", "Nyata, tegak, sama besar"],
            answer: 2,
            explanation: "Cermin cembung bersifat menyebarkan sinar (divergen) dan selalu menghasilkan bayangan maya, tegak, dan diperkecil sehingga jangkauan pandang luas."
        },
        {
            q: "22. Dua muatan titik masing-masing +4 μC dan -2 μC terpisah pada jarak 3 cm di udara (k = 9 × 10⁹ Nm²/C²). Besar gaya Coulomb yang bekerja pada kedua muatan adalah...",
            options: ["80 N tarik-menarik", "80 N tolak-menolak", "240 N tarik-menarik", "240 N tolak-menolak"],
            answer: 0,
            explanation: "F = k.|q1.q2|/r² = (9×10⁹ × 4×10⁻⁶ × 2×10⁻⁶) / (3×10⁻²)² = (72×10⁻³) / (9×10⁻⁴) = 80 N. Karena muatan berlawanan tanda, gayanya tarik-menarik."
        },
        {
            q: "23. Tiga buah hambatan masing-masing bernilai 6 Ω disusun secara paralel. Hambatan pengganti rangkaian tersebut adalah...",
            options: ["2 Ω", "3 Ω", "9 Ω", "18 Ω"],
            answer: 0,
            explanation: "Untuk n hambatan identik disusun paralel: Rp = R / n = 6 Ω / 3 = 2 Ω."
        },
        {
            q: "24. Sebuah lampu bertuliskan spesifikasi 60 W / 220 V dipasang pada tegangan listrik 220 V selama 5 jam. Energi listrik yang terpakai oleh lampu tersebut adalah...",
            options: ["0,3 kWh", "3 kWh", "300 kWh", "1.080 kWh"],
            answer: 0,
            explanation: "Energi W = P × t = 60 Watt × 5 jam = 300 Wh = 0,3 kWh."
        },
        {
            q: "25. Kawat lurus panjang dialiri arus listrik sebesar 5 A. Besar induksi magnetik pada titik yang berjarak 2 cm dari kawat tersebut adalah... (μ0 = 4π × 10⁻⁷ Wb/Am)",
            options: ["2 × 10⁻⁵ T", "5 × 10⁻⁵ T", "2 × 10⁻⁴ T", "5 × 10⁻⁴ T"],
            answer: 1,
            explanation: "B = (μ0 × I) / (2π × a) = (4π × 10⁻⁷ × 5) / (2π × 2 × 10⁻²) = (10 × 10⁻⁷) / (2 × 10⁻²) = 5 × 10⁻⁵ Tesla."
        },
        {
            q: "26. Salah satu faktor yang memperbesar Gaya Gerak Listrik (GGL) induksi pada kumparan generator listrik adalah...",
            options: ["Mengurangi jumlah lilitan kumparan", "Memperlambat putaran magnet", "Memperbanyak jumlah lilitan kumparan", "Menggunakan magnet yang lebih lemah"],
            answer: 2,
            explanation: "Berdasarkan Hukum Faraday (ε = -N dΦ/dt), GGL induksi berbanding lurus dengan jumlah lilitan (N) dan laju perubahan fluks magnetik."
        },
        {
            q: "27. Sebuah transformator step-down memiliki jumlah lilitan primer 1.000 lilitan dan lilitan sekunder 200 lilitan. Jika tegangan inputnya 220 V, tegangan outputnya adalah...",
            options: ["11 V", "22 V", "44 V", "1.100 V"],
            answer: 2,
            explanation: "Vp / Vs = Np / Ns → 220 / Vs = 1000 / 200 → 220 / Vs = 5 → Vs = 220 / 5 = 44 V."
        },
        {
            q: "28. Urutan spektrum gelombang elektromagnetik dari frekuensi terkecil ke frekuensi terbesar yang benar adalah...",
            options: ["Sinar gamma, sinar-X, cahaya tampak, gelombang radio", "Gelombang radio, inframerah, cahaya tampak, sinar gamma", "Cahaya tampak, ultraviolet, inframerah, gelombang mikro", "Sinar-X, ultraviolet, gelombang mikro, gelombang radio"],
            answer: 1,
            explanation: "Urutan frekuensi terendah ke tertinggi: Gelombang radio → Gelombang mikro → Inframerah → Cahaya tampak → Ultraviolet → Sinar-X → Sinar gamma."
        },
        {
            q: "29. Menurut teori relativitas khusus Einstein, sebuah benda yang bergerak mendekati kecepatan cahaya akan mengalami penyusutan panjang searah geraknya. Fenomena ini disebut...",
            options: ["Dilatasi waktu", "Kontraksi Lorentz", "Efek Compton", "Dualisme gelombang-partikel"],
            answer: 1,
            explanation: "Kontraksi Lorentz (penyusutan panjang) menyatakan bahwa panjang benda yang bergerak relatif terhadap pengamat tampak lebih pendek daripada panjang diamnya."
        },
        {
            q: "30. Suatu unsur radioaktif memiliki waktu paruh 4 tahun. Jika massa awal unsur tersebut 80 gram, maka massa unsur yang tersisa setelah meluruh selama 12 tahun adalah...",
            options: ["5 gram", "10 gram", "20 gram", "40 gram"],
            answer: 1,
            explanation: "Banyaknya waktu paruh n = t / T½ = 12 / 4 = 3 kali peluruhan. Sisa massa Nt = N0 × (1/2)ⁿ = 80 × (1/2)³ = 80 / 8 = 10 gram."
        }
    ];

    // =========================================================================
    // LOGIKA APLIKASI KUIS
    // =========================================================================
    let currentIdx = 0;
    let score = 0;
    let studentInfo = {};
    let userAnswersLog = [];

    function startQuiz() {
        const name = document.getElementById("student-name").value.trim();
        const sClass = document.getElementById("student-class").value;
        const absen = document.getElementById("student-absen").value.trim();

        if (!name || !absen) {
            alert("Harap isi Nama Lengkap dan Nomor Absen terlebih dahulu!");
            return;
        }

        studentInfo = { name, class: sClass, absen };
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        const qObj = quizData[currentIdx];
        document.getElementById("question-counter").innerText = `Soal ${currentIdx + 1} dari ${quizData.length}`;
        document.getElementById("progress-bar").style.width = `${((currentIdx) / quizData.length) * 100}%`;
        document.getElementById("question-text").innerText = qObj.q;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        const expBox = document.getElementById("explanation-box");
        expBox.className = "explanation";
        expBox.innerHTML = "";
        document.getElementById("next-btn").classList.add("hidden");

        qObj.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
            btn.onclick = () => selectAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
        const qObj = quizData[currentIdx];
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(b => b.disabled = true);

        const expBox = document.getElementById("explanation-box");
        const isCorrect = selectedIndex === qObj.answer;

        if (isCorrect) {
            score++;
            selectedBtn.classList.add("correct");
            expBox.classList.add("show", "correct-exp");
            expBox.innerHTML = `<strong>✅ Jawaban Benar!</strong><br>${qObj.explanation}`;
        } else {
            selectedBtn.classList.add("wrong");
            allBtns[qObj.answer].classList.add("correct");
            expBox.classList.add("show", "wrong-exp");
            expBox.innerHTML = `<strong>❌ Jawaban Kurang Tepat.</strong> Jawaban yang benar adalah <strong>${String.fromCharCode(65 + qObj.answer)}</strong>.<br>${qObj.explanation}`;
        }

        // Catat log jawaban siswa
        userAnswersLog.push(`No.${currentIdx + 1}: ${isCorrect ? "BENAR" : "SALAH"} (Jawab: ${String.fromCharCode(65 + selectedIndex)})`);

        const currentGrade = Math.round((score / quizData.length) * 100);
        document.getElementById("live-score").innerText = `Skor Sementara: ${currentGrade}`;

        const nextBtn = document.getElementById("next-btn");
        nextBtn.innerText = (currentIdx === quizData.length - 1) ? "Selesai & Kirim Nilai" : "Soal Berikutnya →";
        nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        const finalGrade = Math.round((score / quizData.length) * 100);
        document.getElementById("result-student-info").innerText = `${studentInfo.name} | Kelas ${studentInfo.class} | No. Absen: ${studentInfo.absen}`;
        document.getElementById("final-score").innerText = finalGrade;
        document.getElementById("correct-count").innerText = `Benar: ${score} dari ${quizData.length} soal`;

        sendEmailReport(finalGrade);
    }

    async function sendEmailReport(finalGrade) {
        const statusEl = document.getElementById("email-status");
        
        if (WEB3FORMS_ACCESS_KEY === "MASUKKAN_ACCESS_KEY_ANDA_DISINI" || !WEB3FORMS_ACCESS_KEY) {
            statusEl.style.color = "#dc2626";
            statusEl.innerText = "⚠️ Access Key email belum diatur oleh guru. Nilai belum terkirim ke email.";
            return;
        }

        const payload = {
            access_key: WEB3FORMS_ACCESS_KEY,
            subject: `Hasil Asesmen Fisika - ${studentInfo.name} (${studentInfo.class})`,
            from_name: "Sistem Asesmen Fisika SMA",
            Nama_Siswa: studentInfo.name,
            Kelas: studentInfo.class,
            Nomor_Absen: studentInfo.absen,
            Nilai_Akhir: `${finalGrade} / 100`,
            Jumlah_Benar: `${score} dari ${quizData.length} soal`,
            Rincian_Jawaban: userAnswersLog.join(" | ")
        };

        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.success) {
                statusEl.style.color = "#16a34a";
                statusEl.innerText = "✅ Hasil nilai dan rincian jawaban berhasil dikirim ke email guru!";
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            statusEl.style.color = "#dc2626";
            statusEl.innerText = "❌ Gagal mengirim laporan ke email. Pastikan koneksi internet stabil.";
        }
    }
</script>
